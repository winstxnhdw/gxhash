[project]
name = "bench"
version = "0.0.0"
description = "Benchmark suite for GxHash"
readme = "README.md"
requires-python = ">=3.14.7"
dependencies = [
  "cityhash>=0.4.10",
  "gxhash",
  "metrohash>=0.4.1",
  "mmh3>=5.3.0",
  "polars>=1.44.2",
  "siphash24>=1.9",
  "stringzilla>=5.1.2",
  "xxhash>=4.0.1",
]

[project.scripts]
bench = "src:main"

[dependency-groups]
dev = [
  "nodejs-wheel-binaries>=24.19.0",
  "pyright>=1.1.414",
  "ruff>=0.16.6",
  "ty>=0.0.80",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
ext-modules = [
  { name = "src.routine", sources = ["src/routine.c"], extra-compile-args = ["-march=native", "-Werror"] }, # EagerRoutine
  { name = "src.compat", sources = ["src/compat.c"], extra-compile-args = ["-march=native", "-Werror"] },   # compat
]

[tool.uv]
required-version = "==0.12.7"

[tool.uv.sources]
gxhash = { path = "../" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",      # pydocstyle (all docstring rules)
  "COM812", # missing-trailing-comma (conflict with ruff format)
  "TC003",  # typing-only-standard-library-import
]

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true

[tool.pyright]
stubPath = "./typings"
typeCheckingMode = "strict"
reportUnknownMemberType = false
